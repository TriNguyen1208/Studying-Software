services:
  postgres:
    image: postgres:16-alpine
    container_name: omnistream_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: omnistream_secure_password
      POSTGRES_DB: omnistream_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_decorator_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnistream_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: omnistream_redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6383:6379"
    volumes:
      - redis_decorator_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_decorator_data:
    driver: local
  redis_decorator_data:
    driver: local
