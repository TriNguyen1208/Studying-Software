apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        # Tự động trích xuất Trace ID từ JSON log để 1-click mở sang Jaeger trace
        - name: TraceID
          matcherRegex: '"(?:trace_id|traceId)":"([a-f0-9]+)"'
          url: '$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: "Xem Trace chi tiết trong Jaeger"

  - name: Jaeger
    type: jaeger
    access: proxy
    uid: jaeger
    url: http://jaeger:16686
    jsonData:
      # Liên kết ngược từ Span trong Jaeger sang Loki Logs
      tracesToLogs:
        datasourceUid: loki
        tags: ['service.name']
        mappedTags:
          - key: 'service.name'
            value: 'service_name'
        filterByTraceId: true
        filterBySpanId: false
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: 'service.name'
            value: 'service'
        queries:
          - name: 'Tỷ lệ lỗi Request liên quan'
            query: 'sum(rate(http_requests_total{status_code=~"5.."}[1m]))'
