# ==============================================================================
# PRODUCTION-GRADE VIRTUAL HOST CONFIGURATION
# ==============================================================================
# File này định nghĩa Reverse Proxy Gateway, Upstream Cluster, Rate Limiting
# và Microcaching cho hệ thống demo.

# ------------------------------------------------------------------------------
# 1. UPSTREAM BACKEND CLUSTER (LOAD BALANCING)
# ------------------------------------------------------------------------------
# Khai báo nhóm máy chủ backend Upstream gồm 3 replica.
# Mặc định sử dụng thuật toán Round-Robin (phân phối đều lần lượt).
upstream backend_cluster {
    server backend-1:3001 max_fails=3 fail_timeout=10s;
    server backend-2:3002 max_fails=3 fail_timeout=10s;
    server backend-3:3003 max_fails=3 fail_timeout=10s;

    # CỰC KỲ QUAN TRỌNG TRONG PRODUCTION:
    # Duy trì sẵn 32 kết nối TCP Keepalive mở sẵn trong pool cho mỗi worker process.
    # Giúp loại bỏ việc bắt tay 3 bước TCP cho từng request sang backend.
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. RATE LIMITING ZONE (LEAKY BUCKET ALGORITHM)
# ------------------------------------------------------------------------------
# - $binary_remote_addr: Dùng địa chỉ IP nhị phân của Client (chỉ tốn 4 bytes cho IPv4 hoặc 16 bytes cho IPv6).
# - zone=api_rate_zone:10m: Cấp phát 10MB RAM để lưu trữ trạng thái của khoảng 160.000 địa chỉ IP đồng thời.
# - rate=5r/s: Giới hạn tốc độ trung bình là 5 requests mỗi giây cho mỗi địa chỉ IP.
limit_req_zone $binary_remote_addr zone=api_rate_zone:10m rate=5r/s;

# ------------------------------------------------------------------------------
# 3. MICROCACHING PATH (BỘ NHỚ ĐỆM PHẢN HỒI)
# ------------------------------------------------------------------------------
# - /var/cache/nginx: Thư mục lưu trữ cache trên đĩa.
# - levels=1:2: Tạo cấu trúc thư mục 2 tầng để tránh quá nhiều file trong 1 thư mục gây chậm ext4.
# - keys_zone=api_microcache:10m: Dành 10MB RAM để lưu trữ danh mục Key tra cứu (Metadata).
# - max_size=100m: Dung lượng cache dữ liệu tối đa là 100MB.
# - inactive=60m: Dữ liệu không được truy cập trong 60 phút sẽ bị dọn dẹp.
# - use_temp_path=off: Ghi cache trực tiếp vào thư mục đích, tránh copy trung gian từ temp folder.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_microcache:10m max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # --------------------------------------------------------------------------
    # CHUẨN HÓA REVERSE PROXY HEADERS CHO TOÀN BỘ CÁC ROUTE
    # --------------------------------------------------------------------------
    # Bắt buộc phải có để Backend nhận diện đúng Client và không bị mất ngữ cảnh giao thức:
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Bắt buộc nâng cấp lên HTTP/1.1 và xóa header Connection để Upstream Keepalive hoạt động
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # --------------------------------------------------------------------------
    # ROUTE 1: FRONTEND DASHBOARD (REACT / VITE)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:5173;

        # Hỗ trợ WebSockets Hot Module Replacement (HMR) của Vite
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # --------------------------------------------------------------------------
    # ROUTE 2: LOAD BALANCING INSPECTION (NO CACHE)
    # --------------------------------------------------------------------------
    # Route này dùng để kiểm tra việc luân chuyển tải Round-Robin giữa 3 node backend.
    location /api/load-test {
        proxy_cache off;
        proxy_pass http://backend_cluster;

        # Header thông báo cho Client biết node backend nào đã trực tiếp phục vụ
        add_header X-Handled-By $upstream_addr always;
        add_header X-Nginx-Gateway "Nginx-Reverse-Proxy-Production" always;
    }

    # --------------------------------------------------------------------------
    # ROUTE 3: READ-HEAVY PRODUCTS API (CÓ MICROCACHING)
    # --------------------------------------------------------------------------
    # Minh họa tính năng Microcache: Lưu cache 30 giây, trả kết quả trong 1ms
    location /api/products {
        # Kích hoạt vùng nhớ cache đã khai báo
        proxy_cache api_microcache;

        # Định nghĩa Key dùng để nhận diện cache (dựa vào Method + Scheme + Host + URI)
        proxy_cache_key "$request_method$scheme$host$request_uri";

        # Cache các phản hồi thành công (200, 302) trong vòng 30 giây
        proxy_cache_valid 200 302 30s;
        proxy_cache_valid 404 5s;

        # Trả về cache cũ đã hết hạn nếu các backend đang bị lỗi hoặc quá tải (Tăng độ sẵn sàng)
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Header quan sát trạng thái cache: HIT, MISS, BYPASS, EXPIRED
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Handled-By $upstream_addr always;

        proxy_pass http://backend_cluster;
    }

    # --------------------------------------------------------------------------
    # ROUTE 4: RATE LIMITING SHIELD TEST ROUTE
    # --------------------------------------------------------------------------
    # Minh chứng cơ chế chặn đứng spam bằng Leaky Bucket
    location /api/rate-limit-test {
        # burst=10: Cho phép 10 request vượt ngưỡng được xếp hàng trong bộ đệm
        # nodelay: Xử lý ngay các request trong burst mà không bắt client chờ độ trễ nhân tạo,
        #          nhưng request vượt quá burst sẽ bị từ chối với HTTP 429 ngay lập tức.
        limit_req zone=api_rate_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_cluster/api/load-test;
        add_header X-Handled-By $upstream_addr always;
    }

    # --------------------------------------------------------------------------
    # ROUTE 5: BACKEND STATS AGGREGATION
    # --------------------------------------------------------------------------
    location /api/stats {
        proxy_pass http://backend_cluster;
        add_header X-Handled-By $upstream_addr always;
    }
}
