# ==============================================================================
# PRODUCTION-GRADE NGINX MASTER CONFIGURATION
# ==============================================================================
# File này chứa cấu hình toàn cục (Global Context) cho Nginx Master và Worker processes.

# User thực thi các Worker Process (không chạy dưới root để bảo mật tối đa)
user  nginx;

# Tự động phát hiện và gán 1 Worker Process tương ứng với mỗi nhân CPU vật lý/ảo
# Tại sao? Tránh context switching giữa các nhân CPU, tối ưu hóa bộ nhớ đệm L1/L2/L3.
worker_processes  auto;

# File lưu mã Process ID của Nginx Master Process (dùng để gửi tín hiệu SIGHUP, SIGQUIT)
pid        /var/run/nginx.pid;

# Cấu hình log lỗi hệ thống (error_log) với mức độ warn
error_log  /var/log/nginx/error.log warn;

# Giới hạn số lượng File Descriptors tối đa mà 1 worker process có thể mở
# (Cần thiết cho hệ thống chịu tải cao, mặc định của Linux thường là 1024)
worker_rlimit_nofile 65535;

events {
    # Số lượng kết nối mạng đồng thời tối đa trên 1 worker process
    # Tổng kết nối tối đa = worker_processes * worker_connections
    worker_connections  4096;

    # Cho phép worker nhận tất cả các kết nối mới đang chờ trong hàng đợi kết nối của OS
    # thay vì chỉ nhận từng kết nối một (tăng thông lượng khi có bão traffic)
    multi_accept on;

    # Sử dụng cơ chế I/O multiplexing hướng sự kiện hiệu năng cao nhất trên Linux
    use epoll;
}

http {
    # Nạp danh sách định dạng MIME types (HTML, CSS, JS, hình ảnh, font...)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # ĐỊNH DẠNG LOG VỚI CÁC THÔNG SỐ QUAN SÁT CHUYÊN SÂU (OBSERVABILITY)
    # --------------------------------------------------------------------------
    # Định dạng log mở rộng chứa:
    # - $upstream_addr: Địa chỉ IP và port của backend server đã xử lý request
    # - $upstream_status: Mã HTTP mà backend server trả về
    # - $upstream_response_time: Thời gian backend xử lý (tính bằng giây)
    # - $upstream_cache_status: Trạng thái cache (HIT, MISS, BYPASS, EXPIRED)
    log_format  production_metrics  '$remote_addr - $remote_user [$time_local] "$request" '
                                    'status=$status bytes_sent=$body_bytes_sent '
                                    'referer="$http_referer" user_agent="$http_user_agent" '
                                    'upstream_addr="$upstream_addr" '
                                    'upstream_status="$upstream_status" '
                                    'request_time=$request_time '
                                    'upstream_response_time=$upstream_response_time '
                                    'cache_status="$upstream_cache_status"';

    access_log  /var/log/nginx/access.log  production_metrics;

    # --------------------------------------------------------------------------
    # TỐI ƯU HÓA TRUYỀN DẪN DỮ LIỆU TẦNG KERNEL (ZERO-COPY SENDFILE)
    # --------------------------------------------------------------------------
    # Bật cơ chế Zero-Copy: Truyền trực tiếp dữ liệu từ file trên ổ đĩa vào socket
    # mà không cần nạp vào bộ nhớ người dùng (User-Space) của tiến trình Nginx.
    sendfile        on;

    # Gom các header gói tin TCP và phần đầu của file lại để gửi đi trong 1 gói duy nhất
    # (Chỉ hoạt động khi sendfile được bật)
    tcp_nopush     on;

    # Tắt thuật toán Nagle's Algorithm: Đẩy dữ liệu ra mạng ngay lập tức mà không chờ
    # gom gói, giảm thiểu độ trễ tối đa cho các kết nối keep-alive
    tcp_nodelay    on;

    # Thời gian duy trì kết nối TCP mở giữa Client và Nginx (giây)
    keepalive_timeout  65;

    # Số lượng request tối đa có thể phục vụ qua một kết nối keep-alive trước khi đóng
    keepalive_requests 1000;

    # Ẩn phiên bản Nginx trong response header 'Server' để phòng chống quét lỗ hổng
    server_tokens off;

    # --------------------------------------------------------------------------
    # NÉN DỮ LIỆU GZIP (GIẢM 70% BĂNG THÔNG CHO TEXT/JSON/JS)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # Cân bằng hoàn hảo giữa tỷ lệ nén và mức sử dụng CPU
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Nạp các file cấu hình Virtual Hosts từ thư mục conf.d
    include /etc/nginx/conf.d/*.conf;
}
