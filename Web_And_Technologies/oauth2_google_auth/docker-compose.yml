version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oauth2_google_backend
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - JWT_SECRET=study_oauth2_jwt_super_secret_key_2026
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oauth2_google_frontend
    restart: unless-stopped
    ports:
      - "5182:5182"
    environment:
      - VITE_PORT=5182
    depends_on:
      - backend
