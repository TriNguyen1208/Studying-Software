version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_study_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ecom_study
    entrypoint: [ "/bin/bash", "-c", "mongod --replSet rs0 --bind_ip_all & until mongosh --eval 'rs.initiate()' 2>/dev/null; do sleep 2; done; wait" ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongodb_study_express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mongodb_study_backend
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - MONGO_URI=mongodb://mongodb:27017/ecom_study?replicaSet=rs0
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mongodb_study_frontend
    restart: unless-stopped
    ports:
      - "5181:5181"
    environment:
      - VITE_PORT=5181
    depends_on:
      - backend

volumes:
  mongodb_data:
